<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌵 My Cactus Collection 🌵</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌵 My Cactus Garden 🌵</h1>
        <p>Un prototipo per la mia collezione botanica</p>
    </header>

    <main id="cactus-container">
        </main>

    <script>
        async function loadCactus() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const container = document.getElementById('cactus-container');

                container.innerHTML = data.cactus.map(item => `
                    <article class="card">
                        <img src="${item.immagine}" alt="${item.nome}" onerror="this.src='https://via.placeholder.com/400x250?text=Immagine+Mancante'">
                        <div class="card-content">
                            <span class="badge">${item.soprannome}</span>
                            <h3>${item.nome}</h3>
                            <p>${item.descrizione}</p>
                        </div>
                    </article>
                `).join('');
                
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById('cactus-container').innerHTML = "<p>Errore nel caricamento del database JSON.</p>";
            }
        }

        loadCactus();
    </script>
</body>
</html>
