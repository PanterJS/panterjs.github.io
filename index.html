<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cactus Collection 🌵</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌵 My Cactus Garden</h1>
        <p>Prototipo collezione botanica</p>
    </header>
    
    <nav class="navbar">
        <div class="logo" style="color: white; font-weight: bold;">🌵 CactusDB</div>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Cerca pianta...">
            <select id="filterType">
                <option value="all">Tutti i tipi</option>
                <option value="raro">Rari</option>
                <option value="facile">Cura Facile</option>
                <option value="fiori">Con Fiori</option>
            </select>
        </div>
    </nav>

    <header>
        <h1>🌵 My Cactus Garden</h1>
        <p>Prototipo collezione botanica</p>
    </header>

    <main id="cactus-container">
        <p style="text-align:center;">Caricamento piante in corso...</p>
    </main>

    <section class="download-section">
        <h2>📚 Risorse Utili</h2>
        <p>Scarica le nostre guide gratuite in PDF.</p>
        <div class="download-container">
            <a href="downloads/guida-irrigazione.pdf" class="btn-download" download>
                <span>📄 Guida Irrigazione</span>
            </a>
            <a href="downloads/manuale-rinvaso.pdf" class="btn-download" download>
                <span>📄 Manuale Rinvaso</span>
            </a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
